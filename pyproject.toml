[project]
name = "ledbutton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "pydantic[dotenv]<2.0.0",
    "sqlalchemy",
    "uvicorn",
    "fastapi-jwt-auth[asymmetric]",
    "passlib[bcrypt]",
    "colorlog",
    "schedule",
    "paho-mqtt",
    "python-multipart",
    "bcrypt<=4.0.1",
    "psutil",
    "pyserial",
    "pywin32",
    "fastapi<0.100.0",
    "aiomqtt>=2.5.1",
]

[project.scripts]
ledbutton = "ledbutton:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
